# Element definitions. See public/assets/illustrations/README.md for the
# illustration contract. Iterating on generated art = edit prompt, regenerate,
# bump version. Human art = replace file, set source: human.

- symbol: "Jy"
  name: "Joy"
  number: 1
  group: "core"
  valence: 9
  arousal: 8
  description: "A feeling of great pleasure and happiness."
  somatic: "Upward expansion in chest, lightness."
  illustration:
    file: "assets/illustrations/Jy.svg"
    source: generated
    version: 1
    prompt: >
      A minimal engraved-line rising sun: circle with eight short radiating
      strokes, warm terracotta, upward and expansive.

